name: Validate taxonomy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical L1/L2 taxonomy JSON
        run: node scripts/validate-canonical-l1-l2-json.mjs
      - name: Check generated taxonomy views for drift
        run: node scripts/generate-taxonomy-views.mjs --check
      - name: Test taxonomy view generation and stale-file handling
        run: node --test tests/generated-views.test.mjs
      - name: Validate non-canonical relation proposal
        run: node scripts/validate-relation-proposal.mjs
      - name: Test relation proposal boundaries and references
        run: node --test tests/relation-proposal.test.mjs
      - name: Validate accepted relations
        run: |
          node scripts/validate-accepted-relations.mjs
          node --test tests/accepted-relations.test.mjs
      - name: Validate fieldguide data, provenance, and assets
        run: node scripts/fieldguide-validate.mjs
      - name: Test fieldguide behavior
        run: node --test tests/fieldguide.test.mjs
