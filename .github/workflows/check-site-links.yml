name: Website link health

on:
  schedule:
    # Before the Monday editorial review. GitHub schedules use UTC.
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'viewer/**'
      - 'scripts/check-site-links.mjs'
      - 'tests/site-links.test.mjs'
      - '.github/workflows/check-site-links.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'viewer/**'
      - 'scripts/check-site-links.mjs'
      - 'tests/site-links.test.mjs'
      - '.github/workflows/check-site-links.yml'

permissions:
  contents: read

concurrency:
  group: website-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test link checking and validate local targets
        run: |
          node --test tests/site-links.test.mjs
          node scripts/check-site-links.mjs --local-only
      - name: Check external links
        if: github.event_name != 'pull_request'
        run: node scripts/check-site-links.mjs
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-link-health
          path: .cache/link-health/report.*
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
